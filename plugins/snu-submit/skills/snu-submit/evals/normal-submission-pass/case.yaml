name: normal-submission-pass
expected_outcome: |
  가상 과제 재현. 학생의 PDF는 「과제 3: 정렬 알고리즘 비교 보고서」(알고리즘 실습 002분반)의 요건을 모두 지킨다:
  PDF 1개, 세 절(1. Method / 2. Results / 3. Conclusion), 4쪽 이하(3쪽), 파일 이름 학번_이름_HW3.pdf,
  공지(10/20)의 "첫 쪽에 학번과 이름". 001분반 전용 공지(HWP 제출)는 이 학생에게 적용되지 않는다.
  화면에 가능 기간(연도·시간대 포함)과 "제출 가능"이 보이므로 기간은 열려 있다.
  기대 답변: 판정 PASS, 과제 식별 근거, 확인한 출처, 제출 기간 열림과 함께 eTL에서 직접 제출하라는 권고,
  정답·품질은 확인하지 않는다는 안내. 업로드·제출은 하지 않는다.
